name: Meta-verification harness

on:
  push:
    branches: [main]
    paths:
      - "meta_verification/**"
      - ".github/workflows/meta-verification.yml"
      - ".github/workflows/meta-verification-evidence.yml"
      - ".github/workflows/meta-verification-provenance-verify.yml"
      - ".github/workflows/meta-trust-root-bootstrap.yml"
      - ".github/workflows/component-provenance-live-smoke.yml"
      - ".github/workflows/paper-a-component-evidence.yml"
      - ".github/workflows/paper-a-component-evidence-verify.yml"
      - "META_VERIFICATION_SPECIFICATION.md"
      - "META_VERIFICATION_COMPONENT_REGISTER.md"
  pull_request:
    paths:
      - "meta_verification/**"
      - ".github/workflows/meta-verification.yml"
      - ".github/workflows/component-provenance-live-smoke.yml"
      - "META_VERIFICATION_SPECIFICATION.md"
      - "META_VERIFICATION_COMPONENT_REGISTER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-evaluator-tests:
    name: Fail-closed policy evaluator unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned exact-diagnostic test dependency
        run: python -m pip install --disable-pip-version-check "sympy==1.14.0"

      - name: Validate Paper A semantic-audit source bindings (structural only)
        run: python meta_verification/paper_a_semantic_audit_validator.py

      - name: Run adversarial unit tests
        run: python -m unittest discover -s meta_verification -p 'test_*.py' -v
