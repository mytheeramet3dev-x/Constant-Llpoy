name: Meta-verification signed provenance verification

on:
  workflow_run:
    workflows: ["Meta-verification evidence collection"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  attestations: read

jobs:
  verify-signed-provenance:
    name: Independently verify Sigstore provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact source revision used by the signer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Confirm verifier source revision binding
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Download signed evidence from the completed producer run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: meta-verification-signed-evidence-${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: evidence

      - name: Verify Sigstore signature, certificate identity, source, and subject digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNER_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh --version
          gh attestation verify --help >/dev/null
          python meta_verification/verify_signed_provenance.py \
            --policy meta_verification/signed_provenance_policy.json \
            --subject evidence/github-run-evidence.json \
            --source-sha "$SIGNER_SOURCE_SHA" \
            --output provenance-verification.json

      - name: Upload independent verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta-verification-provenance-verification-${{ github.event.workflow_run.id }}
          path: provenance-verification.json
          if-no-files-found: error
          retention-days: 90
