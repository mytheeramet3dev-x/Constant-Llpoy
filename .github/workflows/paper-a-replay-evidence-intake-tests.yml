name: Paper A replay evidence intake tests
on:
  push:
    branches: [main]
    paths:
      - "meta_verification/paper_a_replay_evidence/**"
      - ".github/workflows/paper-a-replay-evidence-intake-tests.yml"
  pull_request:
    paths:
      - "meta_verification/paper_a_replay_evidence/**"
      - ".github/workflows/paper-a-replay-evidence-intake-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-evidence-intake-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run replay evidence intake tests
        working-directory: meta_verification/paper_a_replay_evidence
        run: python -m unittest discover -s . -p 'test_*.py' -v
