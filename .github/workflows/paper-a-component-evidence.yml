name: Paper A component evidence production
on:
  push:
    branches: [main]
    paths:
      - "formalization/lean/**"
      - "working/paper-a/**"
      - "claims/A/**"
      - "source_snapshots/paper-a/**"
      - "CLAIM_REGISTRY.md"
      - "MANUSCRIPT_SOURCE_MANIFEST.md"
      - "PAPER_A_DEPENDENCY_OBLIGATION_MAP.md"
      - "meta_verification/paper_a_component_pipeline.py"
      - "meta_verification/paper_a_component_provenance_policy.json"
      - ".github/workflows/paper-a-component-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  produce-paper-a-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned diagnostic dependencies
        run: python -m pip install --disable-pip-version-check "sympy==1.14.0" "mpmath==1.3.0"
      - name: Build pinned Lean project and run configured axiom audit
        continue-on-error: true
        uses: leanprover/lean-action@498ce7030982ff0e0cecd98a8f5a7c90615b4e41
        with:
          lake-package-directory: formalization/lean
          use-mathlib-cache: true
          build: true
          axiom-audit: true
      - name: Capture exact Lean build output
        continue-on-error: true
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p evidence
          python meta_verification/paper_a_component_pipeline.py run --component PAPER_A_LEAN_BUILD --source-commit "$SOURCE_COMMIT" --cwd formalization/lean \
            --input formalization/lean/lean-toolchain --input formalization/lean/lakefile.lean --input formalization/lean/lake-manifest.json \
            --input formalization/lean/ConstantLlapoy/PaperA/PerronFrobeniusCore.lean \
            --input formalization/lean/ConstantLlapoy/PaperA/StrongCoupling.lean \
            --input formalization/lean/ConstantLlapoy/PaperA/WeakCoupling.lean \
            --input formalization/lean/ConstantLlapoy/PaperA/ZeroEigenvalueEntropy.lean \
            --input formalization/lean/ConstantLlapoy/PaperA/HamiltonianEncoding.lean \
            --input formalization/lean/ConstantLlapoy.lean \
            --output evidence/paper-a-lean-build.json --timeout 2400 -- lake build
      - name: Run exact Dicke-basis diagnostic
        continue-on-error: true
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python meta_verification/paper_a_component_pipeline.py run --component PAPER_A_DICKE_EXACT_DIAGNOSTIC --source-commit "$SOURCE_COMMIT" \
            --input working/paper-a/dicke_even_basis_exact_diagnostic.py --output evidence/paper-a-dicke-exact.json \
            --timeout 900 -- python working/paper-a/dicke_even_basis_exact_diagnostic.py --n 4 5 6
      - name: Run exact finite-N strong-coupling diagnostic
        continue-on-error: true
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python meta_verification/paper_a_component_pipeline.py run --component PAPER_A_STRONG_COUPLING_EXACT_DIAGNOSTIC --source-commit "$SOURCE_COMMIT" \
            --input working/paper-a/finite_n_strong_coupling_exact_diagnostic.py --output evidence/paper-a-strong-coupling-exact.json \
            --timeout 900 -- python working/paper-a/finite_n_strong_coupling_exact_diagnostic.py --n 4 5 6
      - name: Run high-precision finite-difference diagnostic
        continue-on-error: true
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python meta_verification/paper_a_component_pipeline.py run --component PAPER_A_FINITE_DIFFERENCE_DIAGNOSTIC --source-commit "$SOURCE_COMMIT" \
            --input working/paper-a/edge_response_finite_difference_diagnostic.py --output evidence/paper-a-finite-difference.json \
            --timeout 1200 -- python working/paper-a/edge_response_finite_difference_diagnostic.py --n 4 5 --h 0.2 0.1 --step 1e-4 --dps 40
      - name: Run high-precision weak-coupling diagnostic
        continue-on-error: true
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python meta_verification/paper_a_component_pipeline.py run --component PAPER_A_WEAK_COUPLING_NUMERICAL_DIAGNOSTIC --source-commit "$SOURCE_COMMIT" \
            --input working/paper-a/edge_response_weak_coupling_diagnostic.py --output evidence/paper-a-weak-coupling-numerical.json \
            --timeout 1200 -- python working/paper-a/edge_response_weak_coupling_diagnostic.py --n 4 5 --J 0.005 0.001 --h 1 --dps 50
      - name: Build source-linked Paper A claim traceability manifest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python meta_verification/paper_a_component_pipeline.py traceability --source-commit "$SOURCE_COMMIT" --expected-claims 15 \
            --output evidence/paper-a-claim-traceability.json
      - name: Validate Paper A claim-to-Lean audit structure (not semantic equivalence)
        continue-on-error: true
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python meta_verification/paper_a_component_pipeline.py run --component PAPER_A_SEMANTIC_AUDIT_INTEGRITY --source-commit "$SOURCE_COMMIT" \
            --input meta_verification/paper_a_semantic_audit_validator.py \
            --input meta_verification/paper_a_semantic_correspondence.json \
            --input claims/A/AS-ALPHA-A-DEF-0001.md \
            --input claims/A/AS-ALPHA-A-PROP-0001.md \
            --input claims/A/AS-ALPHA-A-PROP-0002.md \
            --input claims/A/AS-ALPHA-A-PROP-0003.md \
            --input claims/A/AS-ALPHA-A-PROP-0004.md \
            --input claims/A/AS-ALPHA-A-PROP-0005.md \
            --input claims/A/AS-ALPHA-A-PROP-0006.md \
            --input claims/A/AS-ALPHA-A-PROP-0007.md \
            --input claims/A/AS-ALPHA-A-PROP-0008.md \
            --input claims/A/AS-ALPHA-A-PROP-0009.md \
            --input claims/A/AS-ALPHA-A-PROP-0010.md \
            --input claims/A/AS-ALPHA-A-PROP-0011.md \
            --input claims/A/AS-ALPHA-A-PROP-0012.md \
            --input claims/A/AS-ALPHA-A-THM-0001.md \
            --input claims/A/AS-ALPHA-A-THM-0002.md \
            --input formalization/lean/ConstantLlapoy/PaperA/PerronFrobeniusCore.lean \
            --input formalization/lean/ConstantLlapoy/PaperA/StrongCoupling.lean \
            --input formalization/lean/ConstantLlapoy/PaperA/WeakCoupling.lean \
            --input formalization/lean/ConstantLlapoy/PaperA/ZeroEigenvalueEntropy.lean \
            --input formalization/lean/ConstantLlapoy/PaperA/HamiltonianEncoding.lean \
            --output evidence/paper-a-semantic-audit-integrity.json --timeout 180 -- python meta_verification/paper_a_semantic_audit_validator.py
      - name: Build explicit 14-layer Paper A trial assessment
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python meta_verification/paper_a_component_pipeline.py layer-plan --source-commit "$SOURCE_COMMIT" \
            --traceability evidence/paper-a-claim-traceability.json \
            --evidence evidence/paper-a-lean-build.json --evidence evidence/paper-a-dicke-exact.json \
            --evidence evidence/paper-a-strong-coupling-exact.json --evidence evidence/paper-a-finite-difference.json \
            --evidence evidence/paper-a-weak-coupling-numerical.json \
            --evidence evidence/paper-a-semantic-audit-integrity.json --output evidence/paper-a-14-layer-trial-plan.json
      - name: Attest Lean build evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with: { subject-path: evidence/paper-a-lean-build.json }
      - name: Attest exact Dicke diagnostic
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with: { subject-path: evidence/paper-a-dicke-exact.json }
      - name: Attest exact strong-coupling diagnostic
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with: { subject-path: evidence/paper-a-strong-coupling-exact.json }
      - name: Attest finite-difference diagnostic
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with: { subject-path: evidence/paper-a-finite-difference.json }
      - name: Attest weak-coupling numerical diagnostic
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with: { subject-path: evidence/paper-a-weak-coupling-numerical.json }
      - name: Attest claim traceability
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with: { subject-path: evidence/paper-a-claim-traceability.json }
      - name: Attest semantic audit structural-integrity result
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with: { subject-path: evidence/paper-a-semantic-audit-integrity.json }
      - name: Attest 14-layer trial plan
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with: { subject-path: evidence/paper-a-14-layer-trial-plan.json }
      - name: Upload exact component evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-a-component-evidence-${{ github.run_id }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 90
