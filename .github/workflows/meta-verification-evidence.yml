name: Meta-verification evidence collection

on:
  workflow_run:
    workflows: ["Meta-verification harness"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  collect-run-evidence:
    name: Collect authenticated upstream run evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default-branch collector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Collect and validate upstream run through GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python meta_verification/github_run_collector.py \
            --policy meta_verification/github_run_policy.json \
            --output github-run-evidence.json

      - name: Upload normalized run evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta-verification-run-${{ github.event.workflow_run.id }}
          path: github-run-evidence.json
          if-no-files-found: error
          retention-days: 90
