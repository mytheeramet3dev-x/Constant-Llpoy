name: Meta-verification evidence collection

on:
  workflow_run:
    workflows: ["Meta-verification harness"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  collect-run-evidence:
    name: Collect, sign, and verify run evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact trusted default-branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Collect and validate upstream run through GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python meta_verification/github_run_collector.py \
            --policy meta_verification/github_run_policy.json \
            --output github-run-evidence.json

      - name: Generate Sigstore-signed SLSA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: github-run-evidence.json

      - name: Verify signature, identity, source revision, and exact subject digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECTOR_SOURCE_SHA: ${{ github.sha }}
        run: |
          gh --version
          gh attestation verify --help >/dev/null
          python meta_verification/verify_signed_provenance.py \
            --policy meta_verification/signed_provenance_policy.json \
            --subject github-run-evidence.json \
            --source-sha "$COLLECTOR_SOURCE_SHA" \
            --output provenance-verification.json

      - name: Upload evidence and verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meta-verification-signed-evidence-${{ github.event.workflow_run.id }}
          path: |
            github-run-evidence.json
            provenance-verification.json
          if-no-files-found: error
          retention-days: 90
